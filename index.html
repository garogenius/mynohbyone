<!doctype html>
<html lang="en" data-theme="dark" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Nohby ONE — Local-first personal AI operating assistant by Nohby Technologies Limited."
    />
    <title>Nohby ONE — Personal AI Operating Assistant</title>
    <link rel="icon" type="image/png" href="/icon-white.png" />
    <link rel="shortcut icon" type="image/png" href="/icon-white.png" />
    <link rel="apple-touch-icon" href="/icon-white.png" />
    <script>
      (function () {
        try {
          var pref = localStorage.getItem("nohbyone.theme") || "dark";
          var resolved =
            pref === "system"
              ? window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark"
              : pref;
          document.documentElement.setAttribute("data-theme", resolved);
          document.documentElement.classList.toggle("dark", resolved === "dark");
          document.documentElement.classList.toggle("light", resolved === "light");
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
